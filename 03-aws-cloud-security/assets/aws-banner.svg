<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">AWS Cloud Security Assessment portfolio banner</title>
<desc id="desc">A navy blueprint-inspired banner with a cloud, shield and connected service nodes, titled AWS Cloud Security Assessment.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09152c"/><stop offset="1" stop-color="#142543"/></linearGradient>
  <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#45c6df"/><stop offset="1" stop-color="#f4b25c"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#3f6480" stroke-width=".65" opacity=".22"/></pattern>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<path d="M54 58V262" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="80" y="92" font-size="18" letter-spacing="3" font-weight="bold" fill="#67dce7">CYBERSECURITY PORTFOLIO</text>
 <text x="80" y="160" font-size="49" font-weight="bold" fill="#f2f6ff">AWS Cloud Security</text>
 <text x="80" y="215" font-size="49" font-weight="bold" fill="#f2f6ff">Assessment</text>
 <text x="81" y="266" font-size="20" fill="#b8d4ed">IAM / MONITORING / CONFIGURATION / REMEDIATION</text>
</g>
<!-- Generic, original cloud and shield graphics: no vendor logos -->
<g transform="translate(843,83)" fill="none" stroke="#6cd8ee" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
 <path d="M35 144H7c-23 0-38-19-38-39 0-21 18-38 40-38 3-28 26-50 55-50 22 0 43 13 51 34 9-5 18-7 28-7 31 0 55 24 55 54s-23 46-52 46H35"/>
 <path d="M79 62L118 79v35c0 36-22 58-39 67-17-9-39-31-39-67V79z" fill="#0a2a43" stroke="#f2b467" stroke-width="4"/>
 <rect x="67" y="108" width="24" height="27" rx="4" stroke="#f2b467" stroke-width="4"/>
 <path d="M72 108v-7a7 7 0 0114 0v7" stroke="#f2b467" stroke-width="4"/>
</g>
<g fill="#09152c" stroke="#f0b96f" stroke-width="3">
 <circle cx="784" cy="71" r="11"/><circle cx="1119" cy="86" r="11"/><circle cx="1120" cy="239" r="11"/><circle cx="793" cy="251" r="11"/>
</g>
